# -----------------------------------------------------------------------------
# OptimusDB — PostgreSQL 16 config for the AI Query Optimizer dev database.
# Mounted read-only at /etc/postgresql/postgresql.conf and loaded via
# `postgres -c config_file=...`. Data directory, hba_file and ident_file
# resolve from $PGDATA as usual.
# -----------------------------------------------------------------------------

# --- Connection --------------------------------------------------------------
listen_addresses = '*'
port = 5432
max_connections = 100

# --- Memory (sized for TPC-H SF=1 on a dev laptop) --------------------------
shared_buffers = 256MB
work_mem = 16MB
maintenance_work_mem = 128MB
effective_cache_size = 1GB

# --- Query planner (SSD assumptions) ----------------------------------------
random_page_cost = 1.1
effective_io_concurrency = 200

# --- WAL / durability -------------------------------------------------------
wal_level = replica
max_wal_size = 1GB
min_wal_size = 80MB

# --- Logging ----------------------------------------------------------------
log_min_duration_statement = 1000
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'
timezone = 'UTC'

# --- pg_stat_statements ------------------------------------------------------
# Required for Phase 2 workload discovery. Must be preloaded at server start.
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
pg_stat_statements.track_utility = off
pg_stat_statements.save = on
